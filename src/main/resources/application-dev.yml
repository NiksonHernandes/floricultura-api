# Profile dev (SPEC-M0 §3.3). Credenciais vem de env vars exportadas no ambiente/IDE (ver .env.example).
spring:
  jpa:
    show-sql: false
  flyway:
    # dev carrega migracoes comuns + o seed dev-only (AD-SQ-23). A lista SUBSTITUI (nao mescla) a de
    # application.yml, entao os dois locations precisam ser listados. Prod NAO tem db/migration-dev.
    locations: classpath:db/migration,classpath:db/migration-dev
    clean-disabled: true

# Detalhes de health expostos apenas em dev (SPEC-M0 §3.3).
management:
  endpoint:
    health:
      show-details: always

# Origem permitida de CORS em dev (SPEC-M0 §3.4). Consumido pelo CorsConfig em T-M0-2.
app:
  cors:
    allowed-origins: http://localhost:4200

logging:
  level:
    org.springframework.security: INFO
