# Config base comum a todos os profiles (SPEC-M0 §3.3 / AD-SQ-9).
# Segredos NUNCA aqui: o datasource le apenas variaveis de ambiente
# (SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD),
# exportadas no ambiente/IDE em dev (ver .env.example) ou vindas dos secrets do host em prod
# (AD-SQ-13: sem lib de auto-load de .env).
spring:
  application:
    name: floricultura-api
  profiles:
    # Profile default local; em prod defina SPRING_PROFILES_ACTIVE=prod.
    default: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    # Flyway e o dono do schema (AD-SQ-3); Hibernate nunca cria/altera.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    # Baseline V1__baseline.sql entra em T-M0-3.
    enabled: true
    locations: classpath:db/migration
    # M1 — seed do 1o ADMIN sem segredo no repo (SPEC-M1 §3.5): placeholders Flyway resolvidos por
    # env. Camada Flyway (${seed_admin_*} no .sql) != camada Spring (${APP_SEED_ADMIN_*} aqui) — §12.
    # Vazios por default => a V2 e no-op de seed (so cria a coluna).
    placeholders:
      seed_admin_email: ${APP_SEED_ADMIN_EMAIL:}
      seed_admin_senha_hash: ${APP_SEED_ADMIN_SENHA_HASH:}
  mvc:
    # Necessario para o envelope de erro capturar rota 404 (handler em T-M0-2, §12).
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  servlet:
    # M3 — upload de imagem (SPEC-M3 §3.3/§12): o teto do container fica ACIMA do limite de negocio
    # (app.upload.imagem.max-bytes = 2 MB no M5.2) para o validador de servico dar o 400 amigavel antes;
    # se ainda assim estourar, MaxUploadSizeExceededException e traduzida no envelope (400) — T-M3-3.
    # M5.2/§3.7: NAO reduzir o teto do container p/ 2 MB — ele fica acima (6 MB) para o 400 amigavel
    # do servico disparar antes do parse (senao vira MaxUploadSizeExceededException cru na faixa 2-6 MB).
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB
      # T-M3-3: resolucao preguicosa do multipart — o parsing (e o limite do container) so dispara na
      # resolucao do argumento MultipartFile, com o handler ja mapeado, para o @ExceptionHandler LOCAL
      # do ProdutoImagemController traduzir MaxUploadSizeExceededException -> 400 sem tocar web/error/*.
      resolve-lazily: true

# M1 — JWT (SPEC-M1 §3.3/§3.5): segredo HS256 via env, sem default (o app FALHA ao subir sem
# APP_JWT_SECRET — §9); TTL em segundos, default 3600. Consumidores (JwtService) entram no T-M1-2.
# Convive com app.cors.* do application-dev.yml (chaves distintas: jwt vs cors).
app:
  jwt:
    secret: ${APP_JWT_SECRET}
    ttl-seconds: ${APP_JWT_TTL:3600}
  # M3/M5.2 — limite de negocio do upload de imagem (SPEC-M5.2 §3.7/AD-SQ-38): teto de ENTRADA reduzido
  # p/ 2 MB (2097152 bytes), ajustavel por env APP_UPLOAD_IMAGEM_MAX_BYTES. Validacao de tipo + magic
  # bytes inalterada; consumido pela validacao de servico (T-M3-3/T-M5.2-5).
  upload:
    imagem:
      max-bytes: ${APP_UPLOAD_IMAGEM_MAX_BYTES:2097152}
      # M5.2/§3.5: interruptor do encoder WebP. Efetivo = webp-habilitado (config) && webpDisponivel
      # (deteccao runtime do writer nativo). default true = WebP quando o nativo carrega, fallback JPEG q80
      # automatico quando nao. O dono pode setar false no host p/ forcar JPEG SEM redeploy.
      webp-habilitado: ${APP_UPLOAD_IMAGEM_WEBP_HABILITADO:true}

# LGPD (AD-SQ-176 / T-M7-10 R-10) — duas travas de log, base para TODOS os profiles.
#
# 1) org.hibernate.orm.jdbc.error = OFF. O Hibernate (SqlExceptionHelper#logExceptions) chama
#    ERROR_LOG.warn(sqlException.getMessage()) com a mensagem CRUA do servidor ANTES de a excecao
#    subir para o @ExceptionHandler — e essa mensagem traz o "Detalhe: Key (email)=(...)" do
#    PostgreSQL. Como e WARN, passava pelo logging.level.root=INFO de prod. O MESMO incidente ja e
#    logado pelo app em forma redigida (DiagnosticoIntegridade: constraint + SQLState + classe), nos
#    3 pontos que tratam DataIntegrityViolationException; o duplicado so acrescentava o dado pessoal.
#    TRADE-OFF DECLARADO: perde-se tambem a linha "HHH000247: ErrorCode/SQLState" para excecoes de
#    banco que nao chegam a handler nenhum — nesses casos resta o stacktrace do catch-all, que o
#    item (2) mantem util. NAO e "%msg" que o renderizador do (2) alcanca: por isso as duas travas.
#
# 2) exception-conversion-word = %exLgpd. Troca o renderizador de stacktrace de TODOS os loggers
#    (ver logback-spring.xml + ThrowableSemMensagemDeBancoConverter): mantem classe e frames, omite a
#    mensagem das causas de banco. Sem isto, log.error("...", ex) do catch-all imprime o
#    "Caused by: org.postgresql.util.PSQLException: ERROR: ... Detalhe: ..." inteiro.
# ⚠️ PORTA LATENTE, achada pelo QA do M7 e NAO consertada de proposito (nao ha rota que a exercite;
#    desligar logger sem sintoma e ruido). LEIA ANTES DE LIGAR BATCHING:
#    org.hibernate.orm.jdbc.batch (BatchImpl) escreve a mensagem CRUA do servidor no slot %m —
#    exatamente como o SqlExceptionHelper fazia antes da trava (1) abaixo. Hoje e INALCANCAVEL porque
#    nao existe hibernate.jdbc.batch_size configurado em profile nenhum (medido: `grep -rn batch
#    src/main/resources/*.yml` nao devolve nada). Quem ligar batching por performance REABRE a mesma
#    porta que a AD-SQ-176 fechou: ligue `org.hibernate.orm.jdbc.batch: "OFF"` junto, ou prove com um
#    caso que o lote nao leva dado pessoal ao log. Medido no M7: uma violacao no LEDGER imprime
#    "Failing row contains (..., Maria Silva Cliente, 1234.56, ...)" — nome de contraparte (V10) e
#    dinheiro (V13) na mesma linha.
logging:
  level:
    org.hibernate.orm.jdbc.error: "OFF"
  exception-conversion-word: "%exLgpd"

# Actuator: expor apenas health e info (SPEC-M0 §3.3).
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # show-details=always somente em dev (ver application-dev.yml).
      show-details: never
