# Config base comum a todos os profiles (SPEC-M0 §3.3 / AD-SQ-9).
# Segredos NUNCA aqui: o datasource le apenas variaveis de ambiente
# (SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD),
# exportadas no ambiente/IDE em dev (ver .env.example) ou vindas dos secrets do host em prod
# (AD-SQ-13: sem lib de auto-load de .env).
spring:
  application:
    name: floricultura-api
  profiles:
    # Profile default local; em prod defina SPRING_PROFILES_ACTIVE=prod.
    default: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    # Flyway e o dono do schema (AD-SQ-3); Hibernate nunca cria/altera.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    # Baseline V1__baseline.sql entra em T-M0-3.
    enabled: true
    locations: classpath:db/migration
    # M1 — seed do 1o ADMIN sem segredo no repo (SPEC-M1 §3.5): placeholders Flyway resolvidos por
    # env. Camada Flyway (${seed_admin_*} no .sql) != camada Spring (${APP_SEED_ADMIN_*} aqui) — §12.
    # Vazios por default => a V2 e no-op de seed (so cria a coluna).
    placeholders:
      seed_admin_email: ${APP_SEED_ADMIN_EMAIL:}
      seed_admin_senha_hash: ${APP_SEED_ADMIN_SENHA_HASH:}
  mvc:
    # Necessario para o envelope de erro capturar rota 404 (handler em T-M0-2, §12).
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  servlet:
    # M3 — upload de imagem (SPEC-M3 §3.3/§12): o teto do container fica ACIMA do limite de negocio
    # (app.upload.imagem.max-bytes = 2 MB no M5.2) para o validador de servico dar o 400 amigavel antes;
    # se ainda assim estourar, MaxUploadSizeExceededException e traduzida no envelope (400) — T-M3-3.
    # M5.2/§3.7: NAO reduzir o teto do container p/ 2 MB — ele fica acima (6 MB) para o 400 amigavel
    # do servico disparar antes do parse (senao vira MaxUploadSizeExceededException cru na faixa 2-6 MB).
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB
      # T-M3-3: resolucao preguicosa do multipart — o parsing (e o limite do container) so dispara na
      # resolucao do argumento MultipartFile, com o handler ja mapeado, para o @ExceptionHandler LOCAL
      # do ProdutoImagemController traduzir MaxUploadSizeExceededException -> 400 sem tocar web/error/*.
      resolve-lazily: true

# M1 — JWT (SPEC-M1 §3.3/§3.5): segredo HS256 via env, sem default (o app FALHA ao subir sem
# APP_JWT_SECRET — §9); TTL em segundos, default 3600. Consumidores (JwtService) entram no T-M1-2.
# Convive com app.cors.* do application-dev.yml (chaves distintas: jwt vs cors).
app:
  jwt:
    secret: ${APP_JWT_SECRET}
    ttl-seconds: ${APP_JWT_TTL:3600}
  # M3/M5.2 — limite de negocio do upload de imagem (SPEC-M5.2 §3.7/AD-SQ-38): teto de ENTRADA reduzido
  # p/ 2 MB (2097152 bytes), ajustavel por env APP_UPLOAD_IMAGEM_MAX_BYTES. Validacao de tipo + magic
  # bytes inalterada; consumido pela validacao de servico (T-M3-3/T-M5.2-5).
  upload:
    imagem:
      max-bytes: ${APP_UPLOAD_IMAGEM_MAX_BYTES:2097152}
      # M5.2/§3.5: interruptor do encoder WebP. Efetivo = webp-habilitado (config) && webpDisponivel
      # (deteccao runtime do writer nativo). default true = WebP quando o nativo carrega, fallback JPEG q80
      # automatico quando nao. O dono pode setar false no host p/ forcar JPEG SEM redeploy.
      webp-habilitado: ${APP_UPLOAD_IMAGEM_WEBP_HABILITADO:true}

# Actuator: expor apenas health e info (SPEC-M0 §3.3).
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # show-details=always somente em dev (ver application-dev.yml).
      show-details: never
